name: "✈️ Deploy to Telegram"

on:
  push:
  workflow_dispatch:
    inputs:
      migration_mode:
        description: Database migration mode
        required: false
        type: choice
        default: safe
        options: ['safe', 'yes', 'skip']

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy modules (push)
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::TGCLOUD_TOKEN secret is not set."
            exit 1
          fi
          npx tgcloud fetch || true
          npx tgcloud push --force

      - name: Apply database migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migration_mode != 'skip' }}
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          MIGRATION_MODE: ${{ inputs.migration_mode || 'safe' }}
        run: |
          if [ "$MIGRATION_MODE" = "yes" ] || [ "$MIGRATION_MODE" = "true" ]; then
            npx tgcloud migrate --yes
          else
            npx tgcloud migrate --safe
          fi

      - name: Seed OWNER_ID into database
        shell: bash
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          if [[ ! "$OWNER_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::OWNER_ID secret must be a positive integer."
            exit 1
          fi
          mkdir -p tgcloud/endpoints
          trap 'rm -f tgcloud/endpoints/seedOwner.js && rmdir --ignore-fail-on-non-empty tgcloud/endpoints 2>/dev/null || true' EXIT
          cp scripts/seedOwner.js tgcloud/endpoints/seedOwner.js
          npx tgcloud run endpoints/seedOwner "{ ownerId: ${OWNER_ID} }"

      - name: Sync webhook
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          npx tgcloud webhook sync
          npx tgcloud webhook
