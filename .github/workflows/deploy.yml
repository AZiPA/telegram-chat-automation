name: "✈️ Deploy to Telegram"

on:
  push:
  workflow_dispatch:
    inputs:
      migration_mode:
        description: Database migration mode
        required: false
        type: choice
        default: safe
        options: ['safe', 'yes', 'skip']

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        shell: bash
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::TGCLOUD_TOKEN secret is missing."
            exit 1
          fi
          if [[ ! "$TGCLOUD_TOKEN" =~ ^app[0-9]+:[^[:space:]]+$ ]]; then
            echo "::error::TGCLOUD_TOKEN secret is malformed (expected app<id>:<secret>)."
            exit 1
          fi
          if [ -z "$OWNER_ID" ]; then
            echo "::error::OWNER_ID secret is missing."
            exit 1
          fi
          if [[ ! "$OWNER_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::OWNER_ID secret is malformed (must be a positive integer)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy modules (push)
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          ./node_modules/.bin/tgcloud fetch || true
          ./node_modules/.bin/tgcloud push --force

      - name: Apply database migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migration_mode != 'skip' }}
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          MIGRATION_MODE: ${{ inputs.migration_mode || 'safe' }}
        run: |
          if [ "$MIGRATION_MODE" = "yes" ] || [ "$MIGRATION_MODE" = "true" ]; then
            ./node_modules/.bin/tgcloud migrate --yes
          else
            ./node_modules/.bin/tgcloud migrate --safe
          fi

      - name: Seed OWNER_ID into database
        shell: bash
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          if [[ ! "$OWNER_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::OWNER_ID secret is malformed (must be a positive integer)."
            exit 1
          fi
          ./node_modules/.bin/tgcloud run handlers/message "{owner_id: ${OWNER_ID}}" --ctx '{ci_bootstrap: true}'

      - name: Sync webhook
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          ./node_modules/.bin/tgcloud webhook sync
          ./node_modules/.bin/tgcloud webhook
