name: "✈️ Deploy to Telegram"

on:
  push:
  workflow_dispatch:
    inputs:
      migration_mode:
        description: Database migration mode
        required: false
        type: choice
        default: safe
        options: ['safe', 'yes', 'skip']

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        shell: bash
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          if [[ ! "$TGCLOUD_TOKEN" =~ ^app[0-9]+:[^[:space:]]+$ ]]; then
            echo "::error::TGCLOUD_TOKEN secret is missing or malformed."
            exit 1
          fi
          if [[ ! "$OWNER_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::OWNER_ID secret is missing or must be a positive integer."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy modules (push)
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud push --force

      - name: Apply database migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migration_mode != 'skip' }}
        shell: bash
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          MIGRATION_MODE: ${{ inputs.migration_mode || 'safe' }}
        run: |
          case "$MIGRATION_MODE" in
            safe)
              npx tgcloud migrate --safe
              ;;
            yes)
              npx tgcloud migrate --yes
              ;;
            *)
              echo "::error::Invalid migration_mode: $MIGRATION_MODE"
              exit 1
              ;;
          esac

      - name: Seed OWNER_ID into database
        shell: bash
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          npx tgcloud run handlers/message "{owner_id: ${OWNER_ID}}" --ctx '{ci_bootstrap: true}'

      - name: Sync webhook
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          npx tgcloud webhook sync
          npx tgcloud webhook
